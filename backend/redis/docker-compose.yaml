services:
  redis:
    image: ${REDIS_IMAGE:-redis:7.0.0} # the oldest Redis supported; REDIS_IMAGE tests another server
    ports: ["127.0.0.1::6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 1s, retries: 30}
  valkey:
    image: valkey/valkey:8
    ports: ["127.0.0.1::6379"]
    healthcheck: {test: ["CMD", "valkey-cli", "ping"], interval: 1s, retries: 30}
  cluster:
    image: redis:7.0.0
    network_mode: host # the nodes announce the addresses the tests reach: 127.0.0.1:17000-17002
    command:
      - sh
      - -c
      - |
        for p in 17000 17001 17002; do
          redis-server --port $$p --bind 127.0.0.1 --cluster-enabled yes --cluster-config-file /tmp/nodes-$$p.conf --save "" --daemonize yes
        done
        sleep 1
        redis-cli --cluster create 127.0.0.1:17000 127.0.0.1:17001 127.0.0.1:17002 --cluster-replicas 0 --cluster-yes
        exec sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "for p in 17000 17001 17002; do redis-cli -p $$p cluster info | grep -q cluster_state:ok || exit 1; done"]
      interval: 1s
      retries: 60
