# Weekly pull requests for new versions of the dependencies; CI checks each of them.
version: 2
updates:
  # Released modules: only security updates, so users are not made to raise their versions.
  - package-ecosystem: gomod
    directories: ["/", "/backend/redis", "/codec/msgpack", "/compress/zstd"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    directories: ["/examples", "/benchmarks"]
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
