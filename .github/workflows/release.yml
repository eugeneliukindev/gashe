# Makes the GitHub release of every tag.
name: release

on:
  push:
    tags: ["v[0-9]*", "backend/redis/v*", "codec/msgpack/v*", "compress/zstd/v*"]

permissions:
  contents: write # creates the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the earlier tags, for the notes of a module
      # A root tag: its section of CHANGELOG.md.
      - if: startsWith(github.ref_name, 'v')
        uses: taiki-e/create-gh-release-action@v1.12.0
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}
      # A module tag, such as backend/redis/v0.4.0: the pull requests since its last tag.
      - if: ${{ !startsWith(github.ref_name, 'v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git tag -l "${GITHUB_REF_NAME%/v*}/v*" --sort=-v:refname | sed -n 2p)
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ${last:+--notes-start-tag "$last"}
