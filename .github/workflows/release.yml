name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  version-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: 1.59.0
      - run: just version-fetch "$TAG"
        env:
          TAG: ${{ github.event.release.tag_name }}
