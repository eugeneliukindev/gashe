# Checks the external links of the documentation once a week and on every push to main. It runs
# apart from the docs workflow, so a site that is down does not stop the site from being published.
name: links

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --config lychee.toml --no-progress
            README.md CHANGELOG.md CONTRIBUTING.md examples/README.md 'docs/*/**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub rate limits links checked without one
