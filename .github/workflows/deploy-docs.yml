name: deploy-docs

on:
  push:
    branches: [main]
    paths: # what the site is built from
      - docs/**
      - examples/**
      - "**.go" # the API pages come from the doc comments
      - CHANGELOG.md
      - justfile
      - .github/workflows/deploy-docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false # a deployment that started finishes

jobs:
  zensical-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: 1.59.0
      - run: just zensical-build
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/site

  docs-deploy:
    needs: zensical-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
