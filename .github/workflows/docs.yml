# Builds the documentation site from main and publishes it to GitHub Pages.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write # deploy-pages
  id-token: write # deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false # let a deployment that started finish

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # astral keeps no v10 tag
      - uses: extractions/setup-just@v4
      - run: just docs build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
