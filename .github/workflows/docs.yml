# Builds the documentation site in every language and publishes it to GitHub Pages.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable # docs/build.py check compiles the Go blocks of the pages
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --project docs --locked # the tools of docs/pyproject.toml, at docs/uv.lock
      - run: uv run --project docs --locked python docs/build.py check
      - run: uv run --project docs --locked python docs/build.py build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
