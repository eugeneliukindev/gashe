# Builds the documentation site and publishes it to GitHub Pages, one version per release.
#
# mike keeps every version in the gh-pages branch: a push to main updates "dev", and a tag of the
# root module, vX.Y.Z, adds "X.Y" and moves "latest" to it. The whole branch is then published.
name: docs

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"] # tags of the root module only, not backend/redis/v...
  workflow_dispatch:

permissions:
  contents: write # mike commits to gh-pages
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # a cancelled run could leave gh-pages without its push

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # mike needs the history
      - uses: astral-sh/setup-uv@v10.3.3 # astral keeps no v10 tag
      - run: uv sync --project docs --locked # the tools of docs/pyproject.toml, at docs/uv.lock
      - run: uv run --project docs --locked zensical build --strict # a broken link fails
      - name: Deploy the version with mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || true # the versions published so far, if any
          mike="uv run --project docs --locked mike"
          version=dev
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            version="${version%.*}" # v0.5.2 -> 0.5
          fi
          # Canonical links, social cards and llms.txt point into the version.
          sed -i "s|^site_url = .*|site_url = \"https://eugeneliukindev.github.io/gashe/$version/\"|" zensical.toml
          if [[ "$version" != dev ]]; then
            $mike deploy -F zensical.toml --update-aliases "$version" latest
            $mike set-default -F zensical.toml latest
          else
            $mike deploy -F zensical.toml dev
            # Until the first release with a site, dev is the default version.
            $mike list -F zensical.toml | grep -q latest || $mike set-default -F zensical.toml dev
          fi
          git push origin gh-pages
          git worktree add pages gh-pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - uses: actions/deploy-pages@v5
        id: deployment
