name: docs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rumdl-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          uv: true
      - run: just rumdl-check

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: stable
          uv: true
      - run: just docs-build

  # Not required: a site that is down is no reason to hold a merge.
  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changed
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git diff --quiet "$BASE" HEAD -- '*.md' docs/lychee.toml || echo "docs=true" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'pull_request' || steps.changed.outputs.docs == 'true'
        uses: ./.github/actions/setup
      - if: github.event_name != 'pull_request' || steps.changed.outputs.docs == 'true'
        run: just docs-links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub rate limits links checked without one
