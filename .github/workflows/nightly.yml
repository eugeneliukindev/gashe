name: nightly

on:
  schedule:
    - cron: "0 3 * * *" # what breaks with no change here: new vulnerabilities, dead links
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: stable
      - run: just govulncheck

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just docs-links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub rate limits links checked without one
