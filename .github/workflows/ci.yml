# The just recipes a contributor runs, on every push to main and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: extractions/setup-just@v4
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0 # the version of .golangci.yml
          install-only: true
      - run: just lint
      - uses: crate-ci/typos@v1.52.0

  test:
    strategy:
      matrix:
        go: ["1.25.x", oldstable, stable] # the oldest Go the modules support, and the two Go supports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - uses: extractions/setup-just@v4
      - run: just test
        env:
          GOTOOLCHAIN: local # test on this Go, not a newer one go.mod could ask for

  integration:
    strategy:
      matrix:
        server: [redis, valkey]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: extractions/setup-just@v4
      - run: just redis test ${{ matrix.server }}

  cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: extractions/setup-just@v4
      - run: just redis cluster

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: extractions/setup-just@v4
      - run: just examples

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: extractions/setup-just@v4
      - run: just vuln

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # astral keeps no v10 tag
      - uses: extractions/setup-just@v4
      - run: just docs build
