name: setup
description: just, and Go or uv when a job needs them

inputs:
  go:
    description: The Go version, empty for no Go
    default: ""
  uv:
    description: Install uv
    default: "false"

runs:
  using: composite
  steps:
    - if: inputs.go != ''
      uses: actions/setup-go@v7.0.0
      with:
        go-version: ${{ inputs.go }}
    - if: inputs.uv == 'true'
      uses: astral-sh/setup-uv@v10.3.3
    - uses: extractions/setup-just@v4.0.0
      with:
        just-version: 1.59.0
