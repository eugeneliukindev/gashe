[project]
name = "gashe-docs"
version = "0"
description = "The Python tools of gashe: the documentation site, rumdl, typos, tombi and prek"
requires-python = ">=3.11"
dependencies = [
  "prek==0.5.10",
  "rumdl==0.3.2",
  "tombi==1.10.0",
  "typos==1.52.0",
  "zensical==0.1.0",
]

# The Markdown lint of docs/en/, run by `just docs-lint`.
[tool.rumdl]
flavor = "mkdocs"
# MD013: a paragraph is one line. MD033: version badges and the logo are HTML.
# MD036: the bold labels of the index stay out of the table of contents.
# MD057: zensical --strict checks the links, and knows llms.txt the build writes.
disable = ["MD013", "MD033", "MD036", "MD057"]
exclude = ["docs/en/reference"]  # written by gomarkdoc

[tool.rumdl.per-file-ignores]
# The page is a snippet of a file at the repository root.
"docs/en/changelog.md" = ["MD041"]
"docs/en/glossary.md" = ["MD041"]

[tool.uv]
package = false
