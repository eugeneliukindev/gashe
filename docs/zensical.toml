[project]
site_name = "gashe"
site_description = "Caching for Go services that run as many processes"
site_url = "https://eugeneliukindev.github.io/gashe/"
repo_url = "https://github.com/eugeneliukindev/gashe"
repo_name = "eugeneliukindev/gashe"
edit_uri = "edit/main/docs/en/"
docs_dir = "en"
site_dir = "site"
copyright = "MIT license"
extra_css = ["assets/stylesheets/extra.css"]
extra_javascript = ["assets/javascripts/mermaid-zoom.js", "assets/javascripts/go-roles.js"]
nav = [
  { "Home" = "index.md" },
  { "Getting started" = ["install.md", "quickstart.md", "choose.md", "about/alternatives.md"] },
  { "Guides" = [
    "concepts/setup.md",
    "concepts/loading.md",
    "concepts/invalidation.md",
    "concepts/values.md",
    "concepts/backends.md",
    "concepts/stale.md",
    "concepts/stampedes.md",
    "concepts/negative.md",
    "concepts/outages.md",
    "concepts/breakers.md",
    "concepts/locks.md",
    "concepts/rate-limits.md",
    "concepts/httpcache.md",
    "troubleshooting.md",
    "internals/flow.md",
    "internals/storage.md",
    "internals/benchmarks.md",
  ] },
  { "Recipes" = [
    "recipes/index.md",
    "recipes/postgres.md",
    "recipes/http-client.md",
    "recipes/metrics.md",
    "recipes/testing.md",
    "recipes/changing-types.md",
    "recipes/warm-up.md",
  ] },
  { "Reference" = [
    "reference.md",
    "settings.md",
    { "gashe" = "reference/gashe.md" },
    { "memory" = "reference/memory.md" },
    { "redis" = "reference/redis.md" },
    { "nearcache" = "reference/nearcache.md" },
    { "httpcache" = "reference/httpcache.md" },
    { "backendtest" = "reference/backendtest.md" },
    { "msgpack" = "reference/msgpack.md" },
    { "raw" = "reference/raw.md" },
    { "gzip" = "reference/gzip.md" },
    { "zstd" = "reference/zstd.md" },
    "errors.md",
    { "Glossary" = "glossary.md" },
  ] },
  { "Release notes" = ["changelog.md", "about/version-policy.md", "about/migration.md"] },
]

[project.theme]
variant = "classic"
language = "en"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
custom_dir = "overrides"
features = [
  "content.action.copy",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "announce.dismiss",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.plugins.llmstxt]
full_output = "llms-full.txt"
markdown_description = "gashe is a caching library for Go services that run as many processes: GetOrLoad with stale data, locks, tags, rate limits, circuit breakers and an HTTP middleware, over memory or Redis."

[project.plugins.llmstxt.sections]
"Start" = [{ "index.md" = "what gashe is, a full example, the problems it solves" }]
"Quickstart" = [{ "quickstart.md" = "a first cache, Redis, a policy to start with" }]
"Install" = [{ "install.md" = "the modules, their dependencies and the Go version" }]
"Which setting" = [{ "choose.md" = "a problem, the setting that solves it, and where it is shown" }]
"Concepts" = ["concepts/*.md"]
"Recipes" = ["recipes/*.md"]
"Errors" = [
  { "errors.md" = "every error and when it comes" },
  { "troubleshooting.md" = "symptoms, their causes and fixes" },
]
"Reference" = [
  { "reference.md" = "the packages, with links to pkg.go.dev" },
  { "settings.md" = "every field of the options and the policy, as written in code" },
  "internals/*.md",
  { "changelog.md" = "notable changes of every release" },
  { "glossary.md" = "the terms of the domain" },
]
"About" = ["about/*.md"]

[project.plugins.social]

[project.plugins.redirects.redirect_maps]
"help.md" = "troubleshooting.md#still-stuck"

[project.plugins.privacy]
# Scripts of theme features the site does not use.
assets_exclude = [
  "unpkg.com/pyodide*",
  "unpkg.com/ace-builds*",
  "unpkg.com/glightbox*",
  "cdn.plyr.io/*",
  "player.vimeo.com/*",
  "imasdk.googleapis.com/*",
  "pagead2.googlesyndication.com/*",
  "s0.2mdn.net/*",
]

[project.markdown_extensions]
footnotes = {}
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
# Snippet paths start at the repository root.
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.snippets.dedent_subsections = true
pymdownx.snippets.auto_append = ["docs/snippets/abbreviations.md"]
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
abbr = {}
