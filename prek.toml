default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-yaml" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
  { id = "mixed-line-ending" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "typos"
name = "typos"
language = "system"
entry = "just typos"
pass_filenames = false

[[repos.hooks]]
id = "golangci-lint"
name = "golangci-lint"
language = "system"
entry = "just golangci-lint"
files = '(\.go|go\.mod|\.golangci\.yml)$'
pass_filenames = false

[[repos.hooks]]
id = "tombi-check"
name = "tombi"
language = "system"
entry = "just tombi-check"
files = '\.toml$'
pass_filenames = false

[[repos.hooks]]
id = "rumdl-check"
name = "rumdl"
language = "system"
entry = "just rumdl-check"
files = '^docs/(en/.*\.md|pyproject\.toml)$'
pass_filenames = false

[[repos.hooks]]
id = "actionlint"
name = "actionlint"
language = "system"
entry = "just actionlint"
files = '^\.github/workflows/'
pass_filenames = false

[[repos.hooks]]
id = "commitizen-check"
name = "commitizen"
language = "system"
entry = "just commitizen-check"
stages = ["commit-msg"]
