[[repos]]
repo = "builtin"
hooks = [
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-yaml" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
  { id = "mixed-line-ending" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "typos", name = "typos", language = "system", entry = "just typos", pass_filenames = false },
  { id = "golangci-lint", name = "golangci-lint", language = "system", entry = "just golangci-lint", files = "(\\.go|go\\.mod|\\.golangci\\.yml)$", pass_filenames = false },
  { id = "tombi-lint", name = "tombi", language = "system", entry = "just tombi-lint", files = "\\.toml$", pass_filenames = false },
  { id = "rumdl-lint", name = "rumdl", language = "system", entry = "just rumdl-lint", files = "^docs/(en/.*\\.md|pyproject\\.toml)$", pass_filenames = false },
  { id = "actionlint", name = "actionlint", language = "system", entry = "just actionlint", files = "^\\.github/workflows/", pass_filenames = false },
]
